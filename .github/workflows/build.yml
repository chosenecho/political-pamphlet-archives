name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 校验目录 schema
        run: python scripts/validate_catalog.py

      - name: 立场词表闸门
        run: python scripts/test_vocab.py

      - name: 立场词表与标注审计
        run: python scripts/tools/audit_stance.py

      - name: 用途标注可复现
        run: |
          # label_purpose.py 必须是幂等的：若它还会改动数据，
          # 说明有人手改过 catalog.json，或者规则表与数据不一致。
          python scripts/label_purpose.py
          if ! git diff --quiet -- data/catalog.json; then
            echo "::error::label_purpose.py 改动了数据——手改过 catalog.json 或规则与数据不一致"
            git --no-pager diff --stat -- data/catalog.json
            exit 1
          fi
          echo "用途标注与规则一致"

      - name: 重建目录页
        run: python scripts/build_catalog.py

      - name: 重建专藏清单
        run: python scripts/build_index.py

      - name: 安装浏览器
        run: python -m playwright install --with-deps chromium

      - name: 目录页交互验收
        run: python scripts/test_catalog_ui.py

      - name: 用途轴验收
        run: python scripts/test_purpose_ui.py

      - name: 产物是否与提交一致
        run: |
          if ! git diff --quiet -- docs/ data/; then
            echo "::error::提交的产物与源数据不一致，请本地重跑 scripts/build_catalog.py 与 build_index.py"
            git --no-pager diff --stat -- docs/ data/
            exit 1
          fi
          echo "产物与源数据一致"
