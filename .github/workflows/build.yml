name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 校验目录 schema
        run: python scripts/validate_catalog.py

      - name: 立场词表闸门
        run: python scripts/test_vocab.py

      - name: 立场词表与标注审计
        run: python scripts/tools/audit_stance.py

      - name: 重建目录页
        run: python scripts/build_catalog.py

      - name: 重建专藏清单
        run: python scripts/build_index.py

      - name: 安装浏览器
        run: python -m playwright install --with-deps chromium

      - name: 目录页交互验收
        run: python scripts/test_catalog_ui.py

      - name: 产物是否与提交一致
        run: |
          if ! git diff --quiet -- docs/ data/; then
            echo "::error::提交的产物与源数据不一致，请本地重跑 scripts/build_catalog.py 与 build_index.py"
            git --no-pager diff --stat -- docs/ data/
            exit 1
          fi
          echo "产物与源数据一致"
